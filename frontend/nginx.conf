# ============================================
# Nginx - In-container reverse proxy for Next.js
# ============================================
# Listens on port 3000, proxies to Next.js on port 3001

# Run as root (needed for port binding), Next.js runs as nextjs user
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# Logging
	access_log /var/log/nginx/access.log;

	# Performance
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/xml
		application/rss+xml
		image/svg+xml;
	gzip_min_length 256;

	# Upstream - Next.js standalone server
	upstream nextjs {
		server 127.0.0.1:3001;
	}

	server {
		listen 3000;
		server_name _;

		# Security headers
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# Client body size limit
		client_max_body_size 5M;

		# Proxy timeouts
		proxy_connect_timeout 60s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;

		# Cache Next.js static assets (immutable hashed files)
		location /_next/static/ {
			proxy_pass http://nextjs;
			proxy_set_header Host $host;
			add_header Cache-Control "public, max-age=31536000, immutable";
		}

		# Next.js image optimization
		location /_next/image {
			proxy_pass http://nextjs;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# All routes - proxy to Next.js
		location / {
			proxy_pass http://nextjs;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# WebSocket support
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}

		# Deny access to hidden files
		location ~ /\. {
			deny all;
			access_log off;
			log_not_found off;
		}
	}
}
