# ============================================
# Docker Compose - Frontend + Nginx (Local / Self-hosted)
# ============================================
# Use this for local development or self-hosted servers without Dokploy.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    container_name: mcp-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: mcp-frontend-nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
