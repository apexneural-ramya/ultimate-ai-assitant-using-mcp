# ============================================
# Nginx Reverse Proxy for Next.js Frontend
# ============================================

upstream frontend_app {
	server frontend:3000;
}

server {
	listen 80;
	server_name _;

	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://backend:*;" always;

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_types
		text/plain
		text/css
		text/xml
		text/javascript
		application/json
		application/javascript
		application/xml
		application/rss+xml
		image/svg+xml;
	gzip_min_length 256;

	# Client body size limit
	client_max_body_size 5M;

	# Proxy timeouts
	proxy_connect_timeout 60s;
	proxy_send_timeout 60s;
	proxy_read_timeout 60s;

	# Health check endpoint (Nginx level)
	location /nginx-health {
		access_log off;
		return 200 "OK";
		add_header Content-Type text/plain;
	}

	# Cache static assets served by Next.js
	location /_next/static/ {
		proxy_pass http://frontend_app;
		proxy_set_header Host $host;
		proxy_cache_valid 200 365d;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Next.js image optimization
	location /_next/image {
		proxy_pass http://frontend_app;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# All other routes - proxy to Next.js
	location / {
		proxy_pass http://frontend_app;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket support (for HMR in dev, future use)
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	# Deny access to hidden files
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	# Logging
	access_log /var/log/nginx/frontend_access.log;
	error_log /var/log/nginx/frontend_error.log warn;
}
