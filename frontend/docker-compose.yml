# ============================================
# Docker Compose - Frontend (Dokploy / Traefik)
# ============================================
# For Dokploy: Traefik handles SSL, domain routing, and proxying.
# No separate Nginx needed — Dokploy routes directly to port 3000.
#
# Usage:
#   docker compose up -d          # Start services
#   docker compose down           # Stop services
#   docker compose logs -f        # View logs
#   docker compose up -d --build  # Rebuild and start
#
# For local development with Nginx, use:
#   docker compose -f docker-compose.local.yml up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    container_name: mcp-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
