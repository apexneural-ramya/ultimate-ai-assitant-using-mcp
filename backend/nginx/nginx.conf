# ============================================
# Nginx Reverse Proxy for FastAPI Backend
# ============================================

upstream backend_app {
	server backend:8000;
}

server {
	listen 80;
	server_name _;

	# Security headers
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# Gzip compression
	gzip on;
	gzip_types application/json text/plain application/javascript text/css;
	gzip_min_length 256;

	# Client body size limit (for large MCP payloads)
	client_max_body_size 10M;

	# Timeouts for long-running MCP queries
	proxy_connect_timeout 60s;
	proxy_send_timeout 120s;
	proxy_read_timeout 300s;

	# Health check endpoint (Nginx level)
	location /nginx-health {
		access_log off;
		return 200 "OK";
		add_header Content-Type text/plain;
	}

	# API routes - proxy to FastAPI backend
	location / {
		proxy_pass http://backend_app;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket support (if needed in future)
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	# Deny access to hidden files
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	# Logging
	access_log /var/log/nginx/backend_access.log;
	error_log /var/log/nginx/backend_error.log warn;
}
