# ============================================
# Docker Compose - Backend (Dokploy / Traefik)
# ============================================
# For Dokploy: Traefik handles SSL, domain routing, and proxying.
# No separate Nginx needed — Dokploy routes directly to port 8000.
#
# Usage:
#   docker compose up -d          # Start services
#   docker compose down           # Stop services
#   docker compose logs -f        # View logs
#   docker compose up -d --build  # Rebuild and start
#
# For local development with Nginx, use:
#   docker compose -f docker-compose.local.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
